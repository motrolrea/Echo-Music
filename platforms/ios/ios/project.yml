# XcodeGen manifest for the iOS app shell.
# Regenerate the project with: cd ios && xcodegen generate
name: KumoneIOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  KumoneIOSPackage:
    path: KumoneIOSPackage
targets:
  KumoneIOS:
    type: application
    platform: iOS
    sources:
      - KumoneIOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KumoneIOSPackage
        product: KumoneIOSFeature
      - target: EchoMusicWidget
        embed: true
        codeSign: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Config/KumoneIOS.entitlements
        # Kept in Config/Shared.xcconfig so configure-carplay can opt in
        # without modifying the generated project or the tracked manifest.
        PROVISIONING_PROFILE_SPECIFIER: $(MOU_APP_PROVISIONING_PROFILE)
        ENABLE_PREVIEWS: YES
  EchoMusicWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EchoMusicWidget
        excludes:
          - Info.plist
          - "*.entitlements"
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EchoMusicWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.motrolrea.echomusic.ios.widget
        PRODUCT_NAME: EchoMusicWidget
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: EchoMusicWidget/EchoMusicWidget.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  KumoneIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KumoneIOSUITests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    dependencies:
      - target: KumoneIOS
schemes:
  KumoneIOS:
    build:
      targets:
        KumoneIOS: all
        EchoMusicWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KumoneIOSUITests
    archive:
      config: Release
