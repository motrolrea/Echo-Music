# Echo Music — COMPATIBILITY variant (iOS 15-18). No CiliCili / Bilibili, no Metal wallpapers.
# Built with SWIFT_ACTIVE_COMPILATION_CONDITIONS=MOUMUSIC_COMPAT (see .github/workflows/ios-build.yml).
name: EchoMusic

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MOUMUSIC_COMPAT"

targets:
  EchoMusic:
    type: application
    platform: iOS
    sources:
      - path: Moumusic
        excludes:
          - "en.lproj"
          - "zh-Hans.lproj"
          - "Shaders/**"
          - "LiveActivity/**"
    resources:
      - Moumusic/en.lproj
      - Moumusic/zh-Hans.lproj
      - Moumusic/XProfile.html
    settings:
      base:
        PRODUCT_NAME: EchoMusic
        PRODUCT_BUNDLE_IDENTIFIER: com.motrolrea.echomusic.ios
        MARKETING_VERSION: "1.0.43"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Moumusic/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Moumusic/Info.plist
      properties:
        CFBundleDisplayName: Echo Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Moumusic:
    build:
      targets:
        Moumusic: all
    run:
      config: Debug
    archive:
      config: Release
