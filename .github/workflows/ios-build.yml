name: iOS unsigned IPAs

# Two unsigned IPAs. Never creates a release.
#   full   : platforms/ios (Echo Music, iOS 26+, all features)
#   compat : platforms/ios + platforms/ios15 (same sources, iOS 15-18)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/ios/**"
      - "platforms/ios15/**"
      - "platforms/ios-compat/**"
      - ".github/workflows/ios-build.yml"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  full:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: xcodegen generate

      - name: Package Xcode project (ios26)
        run: |
          cat > platforms/ios/README-Xcode.txt <<'EOF'
          Echo Music - Xcode project (iOS 26, all features)

          1. Unzip, open  ios/KumoneIOS.xcodeproj  in Xcode 26 (macOS 26 or later).
          2. Target KumoneIOS > Signing & Capabilities: choose your Team and a unique Bundle Identifier.
          3. Pick your iPhone (or a simulator) and Run.
          The Swift package  Sources/Kumone  (KumoneCore) is referenced by relative path: keep the folder layout.
          To regenerate the project after editing  ios/project.yml : brew install xcodegen && cd ios && xcodegen generate
          EOF
          ditto -c -k --keepParent platforms/ios EchoMusic-xcode-ios26.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-xcode-ios26
          path: EchoMusic-xcode-ios26.zip

      - name: Build (unsigned)
        working-directory: platforms/ios/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | tail -n 400

      - name: Surface compile errors
        if: failure()
        working-directory: platforms/ios/ios
        run: |
          if [ -f build.log ]; then
            grep -m 10 -E "error:|fatal error:" build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Package IPA
        working-directory: platforms/ios/ios
        run: |
          APP_NAME=$(grep -m1 '^PRODUCT_NAME' Config/Shared.xcconfig | sed -E 's/.*= *//')
          echo "App binary: $APP_NAME"
          APP_PATH="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 | while IFS= read -r -d '' item; do
              codesign --force --sign - --generate-entitlement-der --timestamp=none "$item" || true
            done
          fi
          codesign --force --sign - --entitlements EchoMusicWidget/EchoMusicWidget.entitlements --generate-entitlement-der --timestamp=none "$APP_PATH/PlugIns/EchoMusicWidget.appex"
          cat > /tmp/echo-app-group.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>group.com.motrolrea.echomusic</string></array>
          </dict></plist>
          EOF
          codesign --force --sign - --entitlements /tmp/echo-app-group.plist --generate-entitlement-der --timestamp=none "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/${APP_NAME}.app
          plutil -p dist/Payload/${APP_NAME}.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/EchoMusic-full-ios26-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-full-ios26-unsigned
          path: platforms/ios/ios/dist/EchoMusic-full-ios26-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-full-ios26
          path: platforms/ios/ios/build.log

  compat:
    # iOS 15-18 build of the very same sources as the iOS 26 app: platforms/ios15 lowers the deployment
    # target, adds the iOS 15 stand-ins and patches the few spots that need them (CI checkout only).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Prepare iOS 15 tree
        run: bash platforms/ios15/prepare.sh

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: xcodegen generate

      - name: Package Xcode project (compat)
        run: |
          cat > platforms/ios/README-Xcode.txt <<'EOF'
          Echo Music - Xcode project (iOS 15-18 compatibility build, already patched)

          1. Unzip, open  ios/KumoneIOS.xcodeproj  in Xcode 26 (macOS 26 or later).
          2. Target KumoneIOS > Signing & Capabilities: choose your Team and a unique Bundle Identifier.
          3. Pick your iPhone (or a simulator) and Run.
          The Swift package  Sources/Kumone  (KumoneCore) is referenced by relative path: keep the folder layout.
          To regenerate the project after editing  ios/project.yml : brew install xcodegen && cd ios && xcodegen generate
          EOF
          ditto -c -k --keepParent platforms/ios EchoMusic-xcode-compat.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-xcode-compat
          path: EchoMusic-xcode-compat.zip

      - name: Build (unsigned)
        working-directory: platforms/ios/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | tail -n 400

      - name: Surface compile errors
        if: failure()
        working-directory: platforms/ios/ios
        run: |
          if [ -f build.log ]; then
            grep -m 10 -E "error:|fatal error:" build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Package IPA
        working-directory: platforms/ios/ios
        run: |
          APP_NAME=$(grep -m1 '^PRODUCT_NAME' Config/Shared.xcconfig | sed -E 's/.*= *//')
          echo "App binary: $APP_NAME"
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/${APP_NAME}.app dist/Payload/${APP_NAME}.app
          plutil -p dist/Payload/${APP_NAME}.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion"
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/EchoMusic-compat-ios15-18-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: EchoMusic-compat-ios15-18-unsigned
          path: platforms/ios/ios/dist/EchoMusic-compat-ios15-18-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-compat-ios15-18
          path: platforms/ios/ios/build.log

  # Every successful build of a channel is uploaded to the update host; the two channels are independent
  # (a failed or skipped build of one never changes what the other serves).
  publish-ios26:
    needs: [full]
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[compat-only]') && !contains(github.event.head_commit.message, '[no-publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: EchoMusic-full-ios26-unsigned
          path: dl

      # `secrets` 不能出现在 job 级 if 中，否则整个 workflow 解析失败。改为在步骤里检测：
      # 未配置 IMGBED_TOKEN 时优雅跳过上传，job 仍显示为成功（IPA 产物已由 full 上传）。
      - name: Check update-host token
        id: token
        env:
          IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
        run: |
          if [ -n "$IMGBED_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过上传::仓库未配置 IMGBED_TOKEN，本次仅产出 IPA 产物，不更新下载源。"
          fi

      - name: Upload iOS 26 channel
        if: steps.token.outputs.available == 'true'
        env:
          IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
          CHANNEL: ios26
          BUILD: ${{ github.run_number }}
          IPA: dl/EchoMusic-full-ios26-unsigned.ipa
        run: |
          export VERSION="$(grep -m1 '^MARKETING_VERSION' platforms/ios/ios/Config/Shared.xcconfig | sed -E 's/.*= *//')"
          export NOTES="$(git log -1 --pretty=%s)"
          python3 .github/scripts/publish_update.py

  publish-compat:
    needs: [compat]
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-publish]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: EchoMusic-compat-ios15-18-unsigned
          path: dl

      - name: Check update-host token
        id: token
        env:
          IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
        run: |
          if [ -n "$IMGBED_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过上传::仓库未配置 IMGBED_TOKEN，本次仅产出 IPA 产物，不更新下载源。"
          fi

      - name: Upload compatibility channel
        if: steps.token.outputs.available == 'true'
        env:
          IMGBED_TOKEN: ${{ secrets.IMGBED_TOKEN }}
          CHANNEL: compat
          BUILD: ${{ github.run_number }}
          IPA: dl/EchoMusic-compat-ios15-18-unsigned.ipa
        run: |
          export VERSION="$(grep -m1 '^MARKETING_VERSION' platforms/ios/ios/Config/Shared.xcconfig | sed -E 's/.*= *//')"
          export NOTES="$(git log -1 --pretty=%s)"
          python3 .github/scripts/publish_update.py
